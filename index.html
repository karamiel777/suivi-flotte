<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1214">
<title>Suivi de flotte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1214;--card:#161B1E;--card2:#1D2327;--line:#2a3237;--text:#EDF1F0;--muted:#8f9b98;--acc:#4FB3A5;--acc2:#7fd6c9;--ok:#5fb37a;--warn:#e0a63c;--bad:#d9625a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.45;padding-bottom:70px}
h1,h2,h3{font-family:Fraunces,serif;font-weight:600;margin:0}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:22px;color:var(--acc2)}
.wrap{max-width:920px;margin:0 auto;padding:16px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);padding:9px 14px}
button.pri{background:var(--acc);color:#06201c;border-color:var(--acc);font-weight:700}
button.small{padding:6px 10px;font-size:13px}
input,select,textarea{font:inherit;width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:4px}
label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.veh{cursor:pointer}.veh:hover{border-color:var(--acc)}
.veh h3{font-size:20px}
.muted{color:var(--muted);font-size:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;margin:3px 4px 0 0;border:1px solid}
.b-ok{color:var(--ok);border-color:var(--ok)}.b-warn{color:var(--warn);border-color:var(--warn)}.b-bad{color:var(--bad);border-color:var(--bad)}.b-na{color:var(--muted);border-color:var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0}
.tabs button{white-space:nowrap}.tabs button.on{background:var(--acc);color:#06201c;border-color:var(--acc);font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi div{background:var(--card2);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:20px;color:var(--acc2);font-family:Fraunces,serif}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.login{max-width:360px;margin:12vh auto}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.hide{display:none!important}
.del{color:var(--bad);background:none;border:0;padding:2px 6px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
</style>
</head>
<body>

<div id="loginView" class="wrap login hide">
  <h1 style="font-size:32px;color:var(--acc2)">Suivi de flotte</h1>
  <p class="muted">Véhicules, kilométrage, entretiens et assurances</p>
  <div class="card">
    <label>Email<input id="email" type="email" autocomplete="username"></label>
    <label>Mot de passe<input id="pass" type="password" autocomplete="current-password"></label>
    <div id="err" class="err"></div>
    <button class="pri" style="width:100%;margin-top:6px" id="loginBtn">Se connecter</button>
  </div>
</div>

<div id="denied" class="wrap login hide">
  <h1 style="color:var(--acc2)">Accès non autorisé</h1>
  <p class="muted">Ce compte n'a pas accès au suivi de flotte. Demande à la direction de t'ajouter.</p>
  <button id="deniedOut">Se déconnecter</button>
</div>

<div id="appView" class="hide">
  <header>
    <div><h1 id="title">Suivi de flotte</h1><div class="muted" id="who"></div></div>
    <div style="display:flex;gap:8px">
      <button class="small hide" id="backBtn">← Véhicules</button>
      <button class="small" id="outBtn">Déconnexion</button>
    </div>
  </header>
  <div class="wrap" id="main"></div>
</div>

<script type="module">
import { app, db } from "./firebase-config.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { collection, getDocs, getDoc, doc, addDoc, setDoc, updateDoc, deleteDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const OWNER_EMAIL = "hasymila@gmail.com";   // direction principale
const auth = getAuth(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtAr = n => Number(n||0).toLocaleString('fr-FR') + ' Ar';
const fmtKm = n => Number(n||0).toLocaleString('fr-FR') + ' km';
const dDisp = iso => { if(!iso) return '—'; const p = String(iso).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : iso; };
const today = () => new Date().toISOString().slice(0,10);
const val = id => $(id).value.trim();

let isDirector = false, vehicles = [], currentId = null, tab = 'km', team = [];
let data = {km:[],maint:[],ins:[],fuel:[]};
let showForm = false;

/* ---------- connexion ---------- */
$('loginBtn').onclick = async () => {
  $('err').textContent = '';
  try { await signInWithEmailAndPassword(auth, val('email'), $('pass').value); }
  catch(e){ $('err').textContent = 'Email ou mot de passe incorrect.'; }
};
$('pass').addEventListener('keydown', e => { if(e.key==='Enter') $('loginBtn').click(); });
$('outBtn').onclick = () => signOut(auth);
$('deniedOut').onclick = () => signOut(auth);
$('backBtn').onclick = () => { currentId = null; showForm = false; render(); };

onAuthStateChanged(auth, async user => {
  ['loginView','appView','denied'].forEach(i => $(i).classList.add('hide'));
  if(!user){ $('loginView').classList.remove('hide'); return; }
  const email = (user.email||'').toLowerCase();
  let role = null;
  if(email === OWNER_EMAIL) role = 'direction';
  else { try { const s = await getDoc(doc(db,'fleetStaff',email)); if(s.exists()) role = s.data().role || 'staff'; } catch(e){} }
  if(!role){ $('denied').classList.remove('hide'); return; }
  isDirector = role === 'direction';
  $('who').textContent = (isDirector ? 'Direction' : 'Équipe') + ' · ' + email;
  $('appView').classList.remove('hide');
  currentId = null; showForm = false;
  try { await loadVehicles(); render(); }
  catch(e){ showFatal(e); }
});
function showFatal(e){
  const denied = e && (e.code === 'permission-denied' || /permission/i.test(e.message||''));
  $('main').innerHTML = '<div class="card"><h3>Impossible de charger les données</h3><p class="muted">' +
    (denied ? 'Firebase refuse l\'accès : les règles Firestore du suivi de flotte ne sont pas encore publiées (ou la page Règles n\'a pas été publiée). Ajoute les règles du fichier regles-firestore.txt, clique sur « Publier », puis recharge cette page.'
            : 'Erreur : ' + esc(e && (e.message||e.code) || e)) + '</p><button class="pri" onclick="location.reload()">Recharger</button></div>';
}

async function loadVehicles(){
  const s = await getDocs(collection(db,'fleetVehicles'));
  vehicles = s.docs.map(d => ({id:d.id, ...d.data()}));
  vehicles.sort((a,b) => (a.plate||'').localeCompare(b.plate||''));
}
async function loadTeam(){
  const s = await getDocs(collection(db,'fleetStaff'));
  team = s.docs.map(d => ({id:d.id, ...d.data()}));
}
async function loadVehicleData(id){
  const q = c => getDocs(query(collection(db,c), where('vehicleId','==',id)));
  const [k,m,i,f] = await Promise.all([q('fleetKmLogs'), q('fleetMaintenance'), q('fleetInsurances'), q('fleetFuel')]);
  const map = s => s.docs.map(d=>({id:d.id,...d.data()}));
  const byDate = (a,b) => (b.date||'').localeCompare(a.date||'');
  data.km = map(k).sort(byDate); data.maint = map(m).sort(byDate); data.fuel = map(f).sort(byDate);
  data.ins = map(i).sort((a,b)=>(b.endDate||'').localeCompare(a.endDate||''));
}

/* ---------- calculs ---------- */
const currentKm = (v, logs) => Math.max(Number(v.km||0), ...(logs||[]).map(l=>Number(l.km||0)), 0);
function expiryBadge(label, iso){
  if(!iso) return `<span class="badge b-na">${label} : non renseignée</span>`;
  const days = Math.floor((new Date(iso+'T00:00:00') - new Date(today()+'T00:00:00'))/86400000);
  if(days < 0) return `<span class="badge b-bad">${label} expirée (${dDisp(iso)})</span>`;
  if(days <= 30) return `<span class="badge b-warn">${label} : ${days} j (${dDisp(iso)})</span>`;
  return `<span class="badge b-ok">${label} OK · ${dDisp(iso)}</span>`;
}
const insuranceEnd = (v, list) => { const e=(list||[]).map(i=>i.endDate).filter(Boolean).sort(); return e.length ? e[e.length-1] : (v.insuranceExpiry||''); };

/* ---------- affichage ---------- */
function render(){
  $('backBtn').classList.toggle('hide', !currentId && !showForm);
  if(currentId) return renderDetail();
  if(showForm) return renderVehicleForm(null);
  renderList();
}

function renderList(){
  $('title').textContent = 'Suivi de flotte';
  let html = `<div class="bar"><span class="muted">${vehicles.length} véhicule(s)</span><div style="display:flex;gap:8px">
    ${isDirector ? '<button class="small" id="teamBtn">Équipe</button>' : ''}<button class="pri small" id="addVeh">+ Véhicule</button></div></div>`;
  if(!vehicles.length) html += '<div class="card muted">Aucun véhicule pour l\'instant. Clique sur « + Véhicule » pour ajouter le premier.</div>';
  else html += '<div class="grid">' + vehicles.map(v => `
    <div class="card veh" data-id="${v.id}">
      <h3>${esc(v.brand)} ${esc(v.model)}</h3>
      <div class="muted">${esc(v.plate||'')} ${v.color? '· '+esc(v.color):''}</div>
      <div style="margin-top:8px"><b>${fmtKm(v.km)}</b> <span class="muted">(dernier km connu)</span></div>
      <div>${expiryBadge('Assurance', v.insuranceExpiry)}${expiryBadge('Visite', v.visiteExpiry)}${expiryBadge('Carte grise', v.carteGriseExpiry)}</div>
    </div>`).join('') + '</div>';
  $('main').innerHTML = html;
  $('addVeh').onclick = () => { showForm = true; render(); };
  if($('teamBtn')) $('teamBtn').onclick = renderTeam;
  document.querySelectorAll('.veh').forEach(el => el.onclick = async () => {
    currentId = el.dataset.id; tab = 'km'; $('main').innerHTML = '<p class="muted">Chargement…</p>';
    try { await loadVehicleData(currentId); render(); } catch(e){ showFatal(e); }
  });
}

/* ----- Fiche véhicule (création / modification) — aucun prix d'achat ----- */
function renderVehicleForm(v){
  $('backBtn').classList.remove('hide');
  $('title').textContent = v ? 'Modifier le véhicule' : 'Nouveau véhicule';
  v = v || {};
  $('main').innerHTML = `<div class="card">
    <div class="two"><label>Marque<input id="f-brand" value="${esc(v.brand)}"></label><label>Modèle<input id="f-model" value="${esc(v.model)}"></label></div>
    <div class="two"><label>Plaque<input id="f-plate" value="${esc(v.plate)}"></label><label>Couleur<input id="f-color" value="${esc(v.color)}"></label></div>
    <div class="two"><label>Km actuel<input id="f-km" type="number" inputmode="numeric" min="0" value="${v.km??''}"></label>
    <label>Vidange tous les (km)<input id="f-int" type="number" inputmode="numeric" min="1000" value="${v.serviceInterval||7000}"></label></div>
    <div class="two"><label>Visite technique valable jusqu'au<input id="f-visite" type="date" value="${esc(v.visiteExpiry)}"></label>
    <label>Carte grise valable jusqu'au<input id="f-cg" type="date" value="${esc(v.carteGriseExpiry)}"></label></div>
    <label>Km à la dernière vidange (facultatif)<input id="f-last" type="number" inputmode="numeric" min="0" value="${v.lastMaintenanceKm??''}"></label>
    <label>Notes<textarea id="f-notes" rows="2">${esc(v.notes)}</textarea></label>
    <div id="f-err" class="err"></div>
    <button class="pri" id="f-save" style="margin-top:6px">Enregistrer</button></div>`;
  $('f-save').onclick = async () => {
    if(!val('f-brand') || !val('f-plate')){ $('f-err').textContent = 'Marque et plaque sont obligatoires.'; return; }
    const payload = {brand:val('f-brand'), model:val('f-model'), plate:val('f-plate').toUpperCase(), color:val('f-color'),
      km:Number($('f-km').value||0), serviceInterval:Number($('f-int').value||7000), visiteExpiry:$('f-visite').value, carteGriseExpiry:$('f-cg').value,
      lastMaintenanceKm:Number($('f-last').value||0), notes:val('f-notes')};
    if(v.id) await updateDoc(doc(db,'fleetVehicles',v.id), payload);
    else await addDoc(collection(db,'fleetVehicles'), {...payload, createdAt:serverTimestamp()});
    showForm = false; await loadVehicles();
    if(v.id){ await loadVehicleData(v.id); }
    render();
  };
}

function renderDetail(){
  const v = vehicles.find(x=>x.id===currentId); if(!v){ currentId=null; return render(); }
  $('backBtn').classList.remove('hide');
  if(showForm) return renderVehicleForm(v);
  $('title').textContent = (v.brand||'') + ' ' + (v.model||'');
  const km = currentKm(v, data.km), interval = Number(v.serviceInterval||7000);
  const nextKm = Number(v.lastMaintenanceKm||0) + interval, left = nextKm - km;
  const tabs = [['km','Kilométrage'],['fuel','Carburant'],['maint','Entretiens'],['ins','Assurances']];
  if(isDirector) tabs.push(['cost','Coûts']);
  $('main').innerHTML = `
    <div class="card">
      <div class="bar" style="margin-bottom:0"><div class="muted">${esc(v.plate||'')} ${v.color?'· '+esc(v.color):''}</div>
      <button class="small" id="editVeh">Modifier</button></div>
      <div class="kpi" style="margin-top:10px">
        <div><span class="muted">Km actuel</span><b>${fmtKm(km)}</b></div>
        <div><span class="muted">Prochaine vidange</span><b>${fmtKm(nextKm)}</b><span class="muted">${left>=0? 'dans '+fmtKm(left) : 'dépassée de '+fmtKm(-left)}</span></div>
      </div>
      <div style="margin-top:6px">${expiryBadge('Assurance', insuranceEnd(v,data.ins))}${expiryBadge('Visite', v.visiteExpiry)}${expiryBadge('Carte grise', v.carteGriseExpiry)}</div>
    </div>
    <div class="tabs">${tabs.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>
    <div id="pane"></div>`;
  $('editVeh').onclick = () => { showForm = true; render(); };
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; renderDetail(); });
  ({km:paneKm, fuel:paneFuel, maint:paneMaint, ins:paneIns, cost:paneCost})[tab](v);
}

const delBtn = (coll,id) => isDirector ? `<button class="del" data-del="${coll}|${id}" title="Supprimer">✕</button>` : '';
function bindDel(){
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if(!confirm('Supprimer cette ligne ?')) return;
    const [c,id] = b.dataset.del.split('|'); await deleteDoc(doc(db,c,id));
    await loadVehicleData(currentId); renderDetail();
  });
}
const saveErr = (id,msg) => { $(id).textContent = msg; };

/* ----- Kilométrage ----- */
function paneKm(v){
  $('pane').innerHTML = `
    <div class="card"><h3>Nouveau relevé</h3>
      <div class="two"><label>Date<input id="k-date" type="date" value="${today()}"></label>
      <label>Kilométrage<input id="k-km" type="number" inputmode="numeric" min="0"></label></div>
      <label>Relevé par<input id="k-by" placeholder="Nom de la personne"></label>
      <label>Note (facultatif)<input id="k-note"></label>
      <div id="k-err" class="err"></div><button class="pri" id="k-save">Enregistrer</button></div>
    <div class="card"><h3>Historique</h3>${data.km.length ? data.km.map(l=>`
      <div class="row"><div><b>${fmtKm(l.km)}</b><div class="muted">${dDisp(l.date)} · par ${esc(l.recordedBy||'—')}${l.note?' · '+esc(l.note):''}</div></div>${delBtn('fleetKmLogs',l.id)}</div>`).join('') : '<p class="muted">Aucun relevé pour l\'instant.</p>'}</div>`;
  $('k-save').onclick = async () => {
    const km = Number($('k-km').value), date = $('k-date').value, by = val('k-by');
    if(!km || !date || !by) return saveErr('k-err','Date, km et nom sont obligatoires.');
    const prev = currentKm(v, data.km);
    if(km < prev && !confirm(`Ce km (${fmtKm(km)}) est inférieur au dernier connu (${fmtKm(prev)}). Enregistrer quand même ?`)) return;
    await addDoc(collection(db,'fleetKmLogs'), {vehicleId:v.id, date, km, recordedBy:by, note:val('k-note'), createdAt:serverTimestamp()});
    if(km > Number(v.km||0)){ await updateDoc(doc(db,'fleetVehicles',v.id), {km}); v.km = km; }
    await loadVehicleData(v.id); renderDetail();
  };
  bindDel();
}

/* ----- Carburant ----- */
function paneFuel(v){
  $('pane').innerHTML = `
    <div class="card"><h3>Nouveau plein</h3>
      <div class="two"><label>Date<input id="u-date" type="date" value="${today()}"></label>
      <label>Km au compteur<input id="u-km" type="number" inputmode="numeric" value="${currentKm(v,data.km)||''}"></label></div>
      <div class="two"><label>Litres<input id="u-l" type="number" step="0.1" inputmode="decimal" min="0"></label>
      ${isDirector ? '<label>Montant (Ar)<input id="u-amount" type="number" inputmode="numeric" min="0"></label>' : '<div></div>'}</div>
      <label>Fait par<input id="u-by" placeholder="Qui a fait le plein ?"></label>
      <div id="u-err" class="err"></div><button class="pri" id="u-save">Enregistrer</button></div>
    <div class="card"><h3>Historique des pleins</h3>${data.fuel.length ? data.fuel.map(f=>`
      <div class="row"><div><b>${Number(f.liters||0).toLocaleString('fr-FR')} L</b> <span class="muted">· ${fmtKm(f.km)}</span>
      <div class="muted">${dDisp(f.date)} · par ${esc(f.by||'—')}</div></div>
      <div style="text-align:right">${isDirector ? fmtAr(f.amount) : ''}${delBtn('fleetFuel',f.id)}</div></div>`).join('') : '<p class="muted">Aucun plein enregistré.</p>'}</div>`;
  $('u-save').onclick = async () => {
    const date=$('u-date').value, km=Number($('u-km').value), l=Number($('u-l').value), by=val('u-by');
    if(!date || !l || !by) return saveErr('u-err','Date, litres et nom sont obligatoires.');
    await addDoc(collection(db,'fleetFuel'), {vehicleId:v.id, date, km, liters:l, by, amount: isDirector ? Number($('u-amount').value||0) : 0, createdAt:serverTimestamp()});
    if(km > Number(v.km||0)){ await updateDoc(doc(db,'fleetVehicles',v.id), {km}); v.km = km; }
    await loadVehicleData(v.id); renderDetail();
  };
  bindDel();
}

/* ----- Entretiens ----- */
function paneMaint(v){
  $('pane').innerHTML = `
    <div class="card"><h3>Nouvel entretien</h3>
      <div class="two"><label>Date<input id="m-date" type="date" value="${today()}"></label>
      <label>Km à l'entretien<input id="m-km" type="number" inputmode="numeric" value="${currentKm(v,data.km)||''}"></label></div>
      <label>Type (vidange, pneus, freins…)<input id="m-type"></label>
      <label>Fait par (personne ou garage)<input id="m-by" placeholder="Qui a fait l'entretien ?"></label>
      <label>Garage / lieu (facultatif)<input id="m-garage"></label>
      ${isDirector ? '<label>Montant (Ar)<input id="m-amount" type="number" inputmode="numeric" min="0"></label>' : ''}
      <label>Détails (facultatif)<textarea id="m-desc" rows="2"></textarea></label>
      <div id="m-err" class="err"></div><button class="pri" id="m-save">Enregistrer</button></div>
    <div class="card"><h3>Historique des entretiens</h3>${data.maint.length ? data.maint.map(m=>`
      <div class="row"><div><b>${esc(m.type||'Entretien')}</b> <span class="muted">· ${fmtKm(m.km)}</span>
      <div class="muted">${dDisp(m.date)} · fait par ${esc(m.performedBy||'—')}${m.garage?' ('+esc(m.garage)+')':''}${m.description?' · '+esc(m.description):''}</div></div>
      <div style="text-align:right">${isDirector ? fmtAr(m.amount) : ''}${delBtn('fleetMaintenance',m.id)}</div></div>`).join('') : '<p class="muted">Aucun entretien enregistré.</p>'}</div>`;
  $('m-save').onclick = async () => {
    const date=$('m-date').value, km=Number($('m-km').value), type=val('m-type'), by=val('m-by');
    if(!date || !km || !type || !by) return saveErr('m-err','Date, km, type et « fait par » sont obligatoires.');
    await addDoc(collection(db,'fleetMaintenance'), {vehicleId:v.id, date, km, type, performedBy:by, garage:val('m-garage'),
      amount: isDirector ? Number($('m-amount').value||0) : 0, description:val('m-desc'), createdAt:serverTimestamp()});
    const upd = {};
    if(/vidange/i.test(type) && km > Number(v.lastMaintenanceKm||0)) upd.lastMaintenanceKm = km;
    if(km > Number(v.km||0)) upd.km = km;
    if(Object.keys(upd).length){ await updateDoc(doc(db,'fleetVehicles',v.id), upd); Object.assign(v, upd); }
    await loadVehicleData(v.id); renderDetail();
  };
  bindDel();
}

/* ----- Assurances ----- */
function paneIns(v){
  $('pane').innerHTML = `
    <div class="card"><h3>Nouveau contrat / renouvellement</h3>
      <label>Assureur<input id="i-co"></label>
      <label>N° de contrat<input id="i-no"></label>
      <div class="two"><label>Début<input id="i-start" type="date" value="${today()}"></label>
      <label>Fin<input id="i-end" type="date"></label></div>
      <label>Type de couverture (tous risques, tiers…)<input id="i-cov"></label>
      ${isDirector ? '<label>Prime payée (Ar)<input id="i-prem" type="number" inputmode="numeric" min="0"></label>' : ''}
      <label>Note (facultatif)<input id="i-note"></label>
      <div id="i-err" class="err"></div><button class="pri" id="i-save">Enregistrer</button></div>
    <div class="card"><h3>Historique des assurances</h3>${data.ins.length ? data.ins.map(i=>`
      <div class="row"><div><b>${esc(i.company||'—')}</b> <span class="muted">· contrat ${esc(i.policyNo||'—')}</span>
      <div class="muted">Du ${dDisp(i.startDate)} au ${dDisp(i.endDate)}${i.coverage?' · '+esc(i.coverage):''}${i.note?' · '+esc(i.note):''}</div></div>
      <div style="text-align:right">${isDirector ? fmtAr(i.premium) : ''}${delBtn('fleetInsurances',i.id)}</div></div>`).join('') : '<p class="muted">Aucune assurance enregistrée.</p>'}</div>`;
  $('i-save').onclick = async () => {
    const co=val('i-co'), start=$('i-start').value, end=$('i-end').value;
    if(!co || !start || !end) return saveErr('i-err','Assureur, début et fin sont obligatoires.');
    if(end < start) return saveErr('i-err','La date de fin est avant le début.');
    await addDoc(collection(db,'fleetInsurances'), {vehicleId:v.id, company:co, policyNo:val('i-no'), startDate:start, endDate:end,
      coverage:val('i-cov'), premium: isDirector ? Number($('i-prem').value||0) : 0, note:val('i-note'), createdAt:serverTimestamp()});
    if(end > (v.insuranceExpiry||'')){ await updateDoc(doc(db,'fleetVehicles',v.id), {insuranceExpiry:end}); v.insuranceExpiry = end; }
    await loadVehicleData(v.id); renderDetail();
  };
  bindDel();
}

/* ----- Coûts (direction seulement, sans prix d'achat) ----- */
function paneCost(v){
  if(!isDirector){ $('pane').innerHTML=''; return; }
  const sum = (a,k) => a.reduce((s,x)=>s+Number(x[k]||0),0);
  const fuel = sum(data.fuel,'amount'), maint = sum(data.maint,'amount'), ins = sum(data.ins,'premium'), total = fuel+maint+ins;
  const kms = data.km.map(l=>Number(l.km)).filter(Boolean);
  const dist = kms.length>=2 ? Math.max(...kms)-Math.min(...kms) : 0;
  $('pane').innerHTML = `<div class="card"><h3>Coûts d'exploitation</h3>
    <p class="muted">Carburant + entretiens + primes d'assurance. Le prix d'achat n'est pas pris en compte.</p>
    <div class="kpi">
      <div><span class="muted">Carburant</span><b>${fmtAr(fuel)}</b></div>
      <div><span class="muted">Entretiens</span><b>${fmtAr(maint)}</b></div>
      <div><span class="muted">Assurances</span><b>${fmtAr(ins)}</b></div>
      <div><span class="muted">Total</span><b>${fmtAr(total)}</b></div>
      <div><span class="muted">Coût au km</span><b>${dist>0 ? fmtAr(Math.round(total/dist)) : '—'}</b><span class="muted">${dist>0 ? 'sur '+fmtKm(dist)+' relevés' : 'il faut au moins 2 relevés km'}</span></div>
    </div></div>`;
}

/* ----- Équipe (direction) ----- */
async function renderTeam(){
  $('backBtn').classList.remove('hide'); $('title').textContent = 'Équipe';
  await loadTeam();
  $('main').innerHTML = `<div class="card"><h3>Donner accès</h3>
    <p class="muted">La personne doit déjà avoir un compte de connexion (le même email que sur ses autres outils).</p>
    <label>Email<input id="t-mail" type="email"></label>
    <label>Rôle<select id="t-role"><option value="staff">Équipe (sans montants)</option><option value="direction">Direction (tout voir)</option></select></label>
    <div id="t-err" class="err"></div><button class="pri" id="t-add">Ajouter</button></div>
    <div class="card"><h3>Personnes ayant accès</h3>
    <div class="row"><div>${OWNER_EMAIL}</div><span class="muted">Direction principale</span></div>
    ${team.map(t=>`<div class="row"><div>${esc(t.id)} <span class="muted">· ${t.role==='direction'?'Direction':'Équipe'}</span></div><button class="del" data-rm="${esc(t.id)}">✕</button></div>`).join('')}</div>`;
  $('t-add').onclick = async () => {
    const m = val('t-mail').toLowerCase(); if(!m.includes('@')) return saveErr('t-err','Email invalide.');
    await setDoc(doc(db,'fleetStaff',m), {role:$('t-role').value, createdAt:serverTimestamp()}); renderTeam();
  };
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    if(!confirm('Retirer cet accès ?')) return; await deleteDoc(doc(db,'fleetStaff',b.dataset.rm)); renderTeam();
  });
}
</script>
